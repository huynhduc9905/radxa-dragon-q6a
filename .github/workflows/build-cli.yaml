name: Build minimal CLI image

on:
  workflow_dispatch:

env:
  GH_TOKEN: "${{ github.token }}"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Runner info
        run: |
          echo "=== CPU ==="
          nproc
          lscpu | grep -E "^(CPU|Model name|Architecture)"
          echo "=== RAM ==="
          free -h
          echo "=== Disk ==="
          df -h / | tail -1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout rsdk (skip unreachable launchpad submodule)
        run: |
          set -euo pipefail

          # Fail fast instead of hanging ~270s on dead remotes
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30

          git clone --depth=1 https://github.com/RadxaOS-SDK/rsdk.git .rsdk
          cd .rsdk

          # git.launchpad.net is frequently unreachable from CI.
          # The Ubuntu keyring is only needed for Ubuntu suites; we build Debian.
          git -c submodule."keyrings/ubuntu".update=none \
              submodule update --init --recursive --depth=1

      - name: Provide Ubuntu keyring without launchpad
        run: |
          set -euo pipefail
          cd .rsdk

          # rsdk-build's prepare_keyrings() runs:
          #   cp -r externals/keyrings/ubuntu/keyrings/. <out>
          # which hard-fails if the directory is absent, so create it.
          mkdir -p externals/keyrings/ubuntu/keyrings

          # Best effort: populate with the real keyring from the Ubuntu archive.
          # An empty directory is still valid for Debian builds.
          curl -fsSL --retry 3 --max-time 60 \
            -o externals/keyrings/ubuntu/keyrings/ubuntu-archive-keyring.gpg \
            http://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg \
            || echo "Ubuntu keyring download failed; continuing (not needed for Debian)"

          echo "=== keyring inventory ==="
          for d in debian/apt-trusted-asc radxa/keyrings ubuntu/keyrings; do
            printf '%s: %s file(s)\n' "$d" "$(ls -A "externals/keyrings/$d" 2>/dev/null | wc -l)"
          done

          # Debian keyrings are mandatory for this build
          test -n "$(ls -A externals/keyrings/debian/apt-trusted-asc)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest

      - name: Build CLI image
        uses: devcontainers/ci@v0.3
        with:
          subFolder: .rsdk
          push: never
          runCmd: |
            set -euo pipefail
            src/bin/rsdk setup
            src/bin/rsdk shell rsdk build --no-pkgs-json radxa-dragon-q6a bookworm cli

      - name: Prepare artifact
        run: |
          set -euo pipefail
          cd .rsdk/out/radxa-dragon-q6a*
          sudo chown -R "$USER:$(id -gn)" .
          xz -vT 0 *.img
          ls -lh

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: radxa-dragon-q6a-cli-bookworm
          path: .rsdk/out/radxa-dragon-q6a*/*.img.xz
          compression-level: 0
