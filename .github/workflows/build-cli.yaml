name: Build minimal CLI image

on:
  workflow_dispatch:

env:
  GH_TOKEN: "${{ github.token }}"
  # Dragon Q6A (QCS6490) vendor packages are only published for Ubuntu noble.
  # https://radxa-repo.github.io/qcs6490-bookworm  -> 404
  # https://radxa-repo.github.io/qcs6490-noble     -> 200
  SUITE: noble
  EDITION: cli
  PRODUCT: radxa-dragon-q6a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Runner info
        run: |
          echo "=== CPU ==="
          nproc
          lscpu | grep -E "^(CPU|Model name|Architecture)"
          echo "=== RAM ==="
          free -h
          echo "=== Disk ==="
          df -h / | tail -1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout rsdk (skip unreachable launchpad submodule)
        run: |
          set -euo pipefail

          # Fail fast instead of hanging ~270s on dead remotes
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30

          git clone --depth=1 https://github.com/RadxaOS-SDK/rsdk.git .rsdk
          cd .rsdk

          # git.launchpad.net (ubuntu-keyring submodule) is unreachable from CI.
          # We restore the keyring from the Ubuntu archive in the next step.
          git -c submodule."keyrings/ubuntu".update=none \
              submodule update --init --recursive --depth=1

      - name: Provide Ubuntu keyring without launchpad
        run: |
          set -euo pipefail
          cd .rsdk

          # rsdk-build's prepare_keyrings() runs:
          #   cp -r externals/keyrings/ubuntu/keyrings/. <out>
          # which hard-fails if the directory is absent.
          mkdir -p externals/keyrings/ubuntu/keyrings

          # noble is an Ubuntu suite, so this keyring is required to verify the
          # archive. prepare_keyrings() also seeds from /usr/share/keyrings/,
          # and rsdk's devcontainer depends on the ubuntu-keyring package, so
          # that acts as a second source if this download fails.
          if curl -fsSL --retry 3 --max-time 60 \
               -o externals/keyrings/ubuntu/keyrings/ubuntu-archive-keyring.gpg \
               http://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg
          then
            echo "Fetched ubuntu-archive-keyring.gpg from the Ubuntu archive"
          else
            echo "WARNING: download failed; relying on the container's ubuntu-keyring package"
            rm -f externals/keyrings/ubuntu/keyrings/ubuntu-archive-keyring.gpg
          fi

          echo "=== keyring inventory ==="
          for d in debian/apt-trusted-asc radxa/keyrings ubuntu/keyrings; do
            printf '%s: %s file(s)\n' "$d" "$(ls -A "externals/keyrings/$d" 2>/dev/null | wc -l)"
          done

          test -n "$(ls -A externals/keyrings/debian/apt-trusted-asc)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest

      - name: Build CLI image
        uses: devcontainers/ci@v0.3
        with:
          subFolder: .rsdk
          push: never
          runCmd: |
            set -euo pipefail
            src/bin/rsdk setup
            # sector-size 512 is the SD card / eMMC layout (4096 is for UFS)
            src/bin/rsdk shell rsdk build \
              --sector-size 512 \
              "${{ env.PRODUCT }}" "${{ env.SUITE }}" "${{ env.EDITION }}"

      - name: Patch boot config for visible console
        run: |
          set -euo pipefail
          OUT=".rsdk/out/${PRODUCT}_${SUITE}_${EDITION}"
          IMG="$(find "$OUT" -maxdepth 1 -name '*.img' -print -quit)"
          test -n "$IMG" || { echo "No .img found in $OUT"; exit 1; }
          echo "Patching $IMG"

          # The stock cmdline (from radxa-system-config-kernel-cmdline-ttymsm0)
          # contains "quiet splash loglevel=4", which leaves HDMI blank on a CLI
          # image because there is no display manager or plymouth splash to draw
          # anything. Dropping it makes the boot log and login prompt visible.
          LOOP="$(sudo losetup --find --show --partscan "$IMG")"
          echo "Loop device: $LOOP"
          # Give the kernel a moment to create the partition nodes
          sudo partprobe "$LOOP" || true
          for _ in $(seq 1 10); do
            [ -e "${LOOP}p3" ] && break
            sleep 1
          done
          lsblk -o NAME,SIZE,FSTYPE,LABEL "$LOOP"

          # Locate partitions by label rather than index so this survives any
          # future layout change (observed: p1=config, p2=efi, p3=rootfs)
          EFI_PART=""; ROOT_PART=""
          for p in "${LOOP}"p*; do
            case "$(sudo blkid -s LABEL -o value "$p" 2>/dev/null || true)" in
              efi)    EFI_PART="$p" ;;
              rootfs) ROOT_PART="$p" ;;
            esac
          done
          echo "EFI=$EFI_PART ROOT=$ROOT_PART"
          test -n "$EFI_PART" && test -n "$ROOT_PART"

          sudo mkdir -p /mnt/q6a-efi /mnt/q6a-root
          sudo mount "$EFI_PART" /mnt/q6a-efi
          sudo mount "$ROOT_PART" /mnt/q6a-root

          # Boot entries (active now) and /etc/kernel/cmdline (survives the next
          # kernel update, since kernel-install regenerates entries from it)
          sudo sed -i 's/ quiet splash//; s/loglevel=4/loglevel=7/' \
            /mnt/q6a-efi/loader/entries/*.conf \
            /mnt/q6a-root/etc/kernel/cmdline

          # 3s is easy to miss when you need to edit the cmdline with "e"
          sudo sed -i 's/^timeout.*/timeout 10/' /mnt/q6a-efi/loader/loader.conf

          echo "=== patched entry ==="
          sudo grep '^options' /mnt/q6a-efi/loader/entries/*.conf
          echo "=== loader.conf ==="
          sudo cat /mnt/q6a-efi/loader/loader.conf

          echo "=== verifying ==="
          sudo grep -q ' quiet' /mnt/q6a-efi/loader/entries/*.conf && { echo "FAIL: quiet remains"; exit 1; }
          sudo grep -q 'splash' /mnt/q6a-efi/loader/entries/*.conf && { echo "FAIL: splash remains"; exit 1; }
          sudo grep -q 'root=UUID=' /mnt/q6a-efi/loader/entries/*.conf || { echo "FAIL: root= lost"; exit 1; }
          sudo grep -q 'console=tty1' /mnt/q6a-efi/loader/entries/*.conf || { echo "FAIL: console=tty1 lost"; exit 1; }
          sudo grep -q 'loglevel=7' /mnt/q6a-root/etc/kernel/cmdline || { echo "FAIL: cmdline not patched"; exit 1; }
          echo "All boot config assertions passed"

          sudo umount /mnt/q6a-efi /mnt/q6a-root
          sudo losetup -d "$LOOP"

      - name: Prepare artifact
        run: |
          set -euo pipefail
          cd ".rsdk/out/${PRODUCT}_${SUITE}_${EDITION}"
          sudo chown -R "$USER:$(id -gn)" .
          echo "=== raw image size ==="
          ls -lh *.img
          xz -vT 0 *.img
          echo "=== compressed ==="
          ls -lh *.img.xz
          sha256sum *.img.xz | tee SHA256SUMS

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-${{ env.SUITE }}-${{ env.EDITION }}
          path: |
            .rsdk/out/${{ env.PRODUCT }}_${{ env.SUITE }}_${{ env.EDITION }}/*.img.xz
            .rsdk/out/${{ env.PRODUCT }}_${{ env.SUITE }}_${{ env.EDITION }}/SHA256SUMS
          compression-level: 0
